# .pre-commit-config.yaml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^app/app/
      - id: end-of-file-fixer
        files: ^app/app/
      - id: check-yaml
        files: ^app/app/
      - id: check-json
        files: ^app/app/
      - id: check-added-large-files
        files: ^app/app/
  # Formatting
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        files: ^app/app/
  # Linting
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear]
        args: [--config=app/.flake8]
        files: ^app/app/
  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [mypy]
        files: ^app/app/
  # Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: ["--profile", "black", "--filter-files"]
        language_version: python3
        files: ^app/app/
  # Modern fast linting with unused code detection
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.15
    hooks:
      - id: ruff
        args: [--select, F401,F841,ARG001,ARG002]  # unused imports, variables, arguments
        files: ^app/app/
  # Pylint for comprehensive checking including unused methods
  - repo: https://github.com/pycqa/pylint
    rev: v3.0.3
    hooks:
      - id: pylint
        args: [--disable=all, --enable=unused-variable,unused-argument,unused-import,unused-wildcard-import]
        files: ^app/app/
  # Unused code detection with custom config
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.11
    hooks:
      - id: vulture
        args: [app/app/, --config=app/vulture.toml]
        pass_filenames: false
