name: Build and Release FastApp

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: write

jobs:
  run-pre-commit:
    uses: ./.github/workflows/pre-commit-workflow.yml
    with:
      runner: 'ubuntu-latest'
      python-enabled: true
      python-version: '3.13'
      project-path: './app'
      automatic-commit-message: 'Automated Changes: Run pre-commit hooks to validate the project'

  build-app:
    needs: run-pre-commit
    uses: ./.github/workflows/build-workflow.yml
    with:
      python-version: '3.13'
      poetry-version: '1.8.4'
      app-name: 'FastApp'
      working-directory: './app'
      build-windowed: true
        
  release-app:
    needs: build-app
    uses: ./.github/workflows/release-workflow.yml
    with:
      app-name: 'FastApp'
      tag-prefix: 'v'
      prerelease: true
      release-title-prefix: 'FastApp'
      artifact-patterns: |
        ./**/FastApp*
      generate-release-notes: true